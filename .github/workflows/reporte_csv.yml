name: Generar Reporte CSV de Ventas

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  ACCEPT_EULA: Y
  MSSQL_PID: Developer
  SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}

jobs:
  generar-reporte-csv:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Clonar repositorio
        uses: actions/checkout@v4

      - name: 2. Levantar SQL Server en Docker
        run: |
          docker run -d --name sqlserver \
            -e "ACCEPT_EULA=${{ env.ACCEPT_EULA }}" \
            -e "MSSQL_PID=${{ env.MSSQL_PID }}" \
            -e "MSSQL_SA_PASSWORD=${{ env.SA_PASSWORD }}" \
            -p 1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest

      - name: 3. Esperar disponibilidad de SQL Server
        run: |
          for i in {1..30}; do
            if docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${{ env.SA_PASSWORD }}' -C -Q "SELECT 1" &> /dev/null || \
               docker exec sqlserver /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P '${{ env.SA_PASSWORD }}' -C -Q "SELECT 1" &> /dev/null; then
              echo "SQL Server listo"
              break
            fi
            sleep 2
          done

      - name: 4. Inicializar BD y exportar Reporte CSV
        run: |
          docker cp ./sql sqlserver:/sql

          if docker exec sqlserver test -f /opt/mssql-tools18/bin/sqlcmd; then
            SQLCMD_BIN="/opt/mssql-tools18/bin/sqlcmd"
          else
            SQLCMD_BIN="/opt/mssql-tools/bin/sqlcmd"
          fi

          docker exec sqlserver $SQLCMD_BIN -S localhost -U sa -P '${{ env.SA_PASSWORD }}' -C -i /sql/create_database.sql
          docker exec sqlserver $SQLCMD_BIN -S localhost -U sa -P '${{ env.SA_PASSWORD }}' -C -i /sql/create_tables.sql
          docker exec sqlserver $SQLCMD_BIN -S localhost -U sa -P '${{ env.SA_PASSWORD }}' -C -i /sql/create_procedure.sql
          docker exec sqlserver $SQLCMD_BIN -S localhost -U sa -P '${{ env.SA_PASSWORD }}' -C -i /sql/create_trigger.sql
          docker exec sqlserver $SQLCMD_BIN -S localhost -U sa -P '${{ env.SA_PASSWORD }}' -C -i /sql/test_data.sql

          # Exportar consulta a CSV desde el contenedor hacia el runner
          docker exec sqlserver $SQLCMD_BIN -S localhost -U sa -P '${{ env.SA_PASSWORD }}' -C -d EmpresaDB -s "," -W -Q "SET NOCOUNT ON; SELECT v.VentaID, v.Producto, v.Cantidad, i.Stock AS StockRestante, a.Mensaje, v.Fecha FROM Ventas v INNER JOIN Inventario i ON v.Producto = i.Producto INNER JOIN AuditoriaVentas a ON v.VentaID = a.VentaID;" > reporte_ventas.csv

          cat reporte_ventas.csv

      - name: 5. Publicar CSV como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reporte-ventas-csv
          path: reporte_ventas.csv
